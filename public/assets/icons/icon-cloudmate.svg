<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="20" width="88" height="88" rx="8" stroke="#059669" stroke-width="3"/>

  <!-- tmux grid representation -->
  <line x1="20" y1="50" x2="108" y2="50" stroke="#059669" stroke-width="2"/>
  <line x1="64" y1="50" x2="64" y2="108" stroke="#059669" stroke-width="2"/>

  <!-- Claude "C" in each pane -->
  <text x="42" y="40" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">C</text>
  <text x="86" y="40" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">C</text>
  <text x="42" y="80" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">C</text>
  <text x="86" y="80" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">C</text>

  <!-- CloudMate text -->
