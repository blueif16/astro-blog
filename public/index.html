<script>
// During parse, before any module loads: fit the world to the window and start the painting (from the module it
// waited three round trips for crowd.js and its imports). The module reuses window.__fit.
(() => {
  const W = 3840, H = 2560, WIDTHS = [1920, 2560, 3456, 3840, 5120];
  const world = document.getElementById("world"), painting = document.getElementById("painting");
  const q = new URLSearchParams(location.search);
  // The lite park, for phones and tablets: a touch screen, or a device reporting 4 GB or less; &tier=lite|full forces
  // one. The module reads it from here (F.lite).
  const lite = q.has("tier") ? q.get("tier") === "lite" : matchMedia("(pointer: coarse)").matches || (navigator.deviceMemory ?? 8) <= 4;
  // A portrait screen can frame part of the park instead of its middle: &view= names one of these, [centre x,
  // centre y, height shown] in park px (candidates for the phone's view, 2026-11-10). Wider screens show the whole park.
  const VIEWS = { centre: [1920, 1280, 2560], west: [1150, 1280, 2560], east: [2950, 1280, 2560],
    boardwalk: [2150, 1380, 1830], dipper: [2450, 1350, 1420], carousel: [1950, 1330, 1600] };
  // Phones (lite, and the screen's short side under 600 CSS px; tablets keep the whole park) open on the design Ran
  // picked on 2026-11-10: the frame, the Dipper framing, the name at the frame's foot, no corgi "?" button.
  // &frame=0|1, &view= and &titleAt=middle override.
  const phone = lite && Math.min(screen.width, screen.height) < 600;
  const focus = VIEWS[q.get("view") ?? (phone ? "dipper" : "")] ?? null;
  // The frame (CSS above); &art=<image url>: that one picture instead of the park, nothing loaded under it.
  const stage = document.getElementById("stage"), frame = q.has("frame") ? q.get("frame") !== "0" : phone, art = q.get("art");
  if (phone) document.documentElement.dataset.phone = "";
  if (frame) document.documentElement.dataset.frame = "";
  if (art) { document.documentElement.dataset.art = ""; document.getElementById("art").src = art; }
  // The box the park fills, in CSS px: the window, or the inside of the frame.
  const box = () => (frame ? [stage.clientWidth, stage.clientHeight] : [innerWidth, innerHeight]);
  const F = window.__fit = { W, H, scale: 1, loaded: 0, tx: 0, ty: 0, lite, frame, art, box };
  // The smallest width that covers the window at the screen's pixel density, at most 2x (a 3x phone gets the 2x
  // painting: 1.3 MB less), and only ever stepping up; lite stops at 3840 (the 5120 one decodes to 70 MB).
  F.pick = (s) => {
    if (art) return;
    const need = W * s * Math.min(devicePixelRatio || 1, 2), widths = WIDTHS.filter((v) => !lite || v <= 3840);
    const w = widths.find((v) => v >= need * 0.95) ?? widths.at(-1);
    if (w > F.loaded) { F.loaded = w; painting.src = `site/park/world_${w}.webp`; }
  };
  F.fit = () => {
    const [bw, bh] = box(), framed = focus && bh > bw;
    const s = F.scale = Math.max(bw / W, bh / (framed ? focus[2] : H));
    // The world's offset: centred, or the view's centre in the middle of the box without uncovering an edge.
    F.tx = framed ? Math.min(0, Math.max(bw - W * s, bw / 2 - focus[0] * s)) : (bw - W * s) / 2;
    F.ty = framed ? Math.min(0, Math.max(bh - H * s, bh / 2 - focus[1] * s)) : (bh - H * s) / 2;
    F.pick(s);
    world.style.transform = `translate(${F.tx}px, ${F.ty}px) scale(${s})`;
  };
  // The park rect the box shows, [x0, y0, x1, y1] park px.
  F.shown = () => { const [bw, bh] = box(); return [-F.tx / F.scale, -F.ty / F.scale, (bw - F.tx) / F.scale, (bh - F.ty) / F.scale]; };
  F.fit();
  if (!art) document.getElementById("preview").src = "site/park/world_960.webp";   // a readable park in ~0.4 s on 4G
})();
</script>

<script type="module">
// The whole park, fixed: the 3:2 painting always covers the window (no scrolling, no bars) and the park strip in its
// middle stays whole on screens from 3:2 to about 2.4:1. Live layers draw in the same 3840 x 2560 park frame.
// Params: &n= crowd size, &hour= 0-24 (default: the visitor's own clock, base/sky.js), &px= animal size (default 38), &t= frozen clock, &panel shows stats,
// &layers=a,b (only these ride layers; empty for none), &crowd=0 (no animals), &occ=0 (no depth order for the
// crowd; &occ=rides: the rides' occluders only, not the painting's cut-outs).
//
// Ride layers live in rides/<name>/layer.js and export mount(ctx) -> { update(t, dt), resize(scale), riders?,
// occluders? }. ctx gives the park frame (3840 x 2560 park px; camera from tests/park-crowd/park.json), the master
// clock, the slots (plate: painting patches; rides; front: drawn over the crowd), addPatch(url, rect) for plate
// patches made with tools/park_patch.py, canvas(slot) for a park-sized canvas that tracks the window's scale, view()
// for the park x-range the window shows (a canvas wider than a ride covers only that part of it), and
// riders(name, key, t) (rides/RIDERS.md), and sky (base/sky.js: the time of day every layer reads; rides/sky grades
// the page by it and draws the sun/moon badge; slots grade, pool and lights sit over front for it and rides/lights).
// Depth (rides/RIDERS.md "Depth"): the crowd's canvas is above the rides slot, so a layer returns `occluders` for
// whatever it draws (or lays back) that animals can stand behind: an array, or a function of clock time t returning
// one, of { rect: [x, y, w, h] park px, sortY, mask? }. sortY is the y of the thing's base (where it meets the deck,
// park px); mask is an image, canvas or URL whose alpha covers rect (none: the rect itself). Animals whose feet are
// above sortY are hidden where the mask is opaque, in the crowd's one draw call; riders a ride draws itself are not
// touched. Optional: matrix [a, b, c, d, e, f] places rect like a canvas transform (a swinging ship: rect in the
// sprite's own units, matrix as drawn); sortLine [xa, ya, xb, yb] replaces sortY with a sloped base for long or
// slanted things (read at the animal's x); crop [sx, sy, sw, sh] takes the mask from part of a sheet. Masks are packed
// once, the first time the crowd sees them: return the same mask objects every frame and move them with rect/matrix.
// Another host: the site can serve this page from one origin and every other file from another (a <base href> to
// that folder, which sends CORS headers). So paths resolve against document.baseURI (never location.href), and every
// image a layer draws into a canvas or a texture, or that the crowd reads as a mask, sets crossOrigin = "anonymous"
// (without it WebGL refuses the pixels).
import { createCamera } from "./base/camera.js";
import { createClock } from "./base/clock.js";
import { getSky } from "./base/sky.js";

const RIDES = ["sky", "sea", "beach", "wildlife", "traffic", "coaster", "wheel", "swings", "teacups", "flume", "pirate", "carousel", "thrill", "corgi", "streetlights", "lights"]; // reviewed rides only

const W = 3840, H = 2560;
const world = document.getElementById("world");
const params = new URLSearchParams(location.search);
// Explore (the title's button fires "explore" on window) leaves for the original site for now; &explore= overrides.
const EXPLORE = params.get("explore") ?? new URL("/work", location.origin).href;
addEventListener("explore", () => { location.href = EXPLORE; });
// The link itself goes there too (a middle click, a new tab), and never to "#explore", which a <base> on another host
// would turn into a page on that host.
document.querySelector(".title .explore")?.setAttribute("href", new URL(EXPLORE, location.href).href);

// The painting (gen/park/world_v2_hd, 9600 x 6400) ships in five widths; the classic script above picks one and
// steps up on resize (window.__fit).
const F = window.__fit;
const painting = document.getElementById("painting");
let scale = F.scale;
function fit() {
  F.fit();
  scale = F.scale;
  crowd?.resize(scale);
}
let crowd = null;
const rides = [];
addEventListener("resize", fit);
// The painting (or the &art picture) is on screen once it is decoded; the placeholders go then.
const ART = Boolean(F.art);
const hero = ART ? document.getElementById("art") : painting;
const shown = hero.decode().catch(() => {});
shown.then(() => { document.getElementById("preview")?.remove(); document.querySelector(".world > .lqip")?.remove(); });

// The title over the sea (site/title): the name, a handwritten line and the Explore button, played in once the
// painting is on screen. &name= overrides the name. In the phone frame (portrait) it sits on the frame's centre line,
// at its foot over the sea, or (&titleAt=middle) in its middle.
const stage = document.getElementById("stage");
const inFrame = () => F.frame && innerHeight > innerWidth;
// In the frame the clock (rides/sky) sits on the same line at the foot: its 40 px badge 12 px above the frame's edge, so
// the title's box stops above it. Read from params, not `wanted` (box() can run before that is defined).
const CLOCK = !ART && (params.has("layers") ? params.get("layers").split(",").includes("sky") : true);
const titleOpts = {
  params,
  box: () => {
    const r = stage.getBoundingClientRect(), foot = inFrame() && CLOCK ? 52 : 0;
    return { left: r.left + stage.clientLeft, top: r.top + stage.clientTop, width: stage.clientWidth, height: stage.clientHeight - foot };
  },
  mode: () => (inFrame() ? { align: "centre", place: params.get("titleAt") === "middle" ? "middle" : "bottom" } : { align: "left", place: "bottom" }),
};
Promise.all([
  import("./site/title/title.js").then((m) => m.mountTitle(document.getElementById("title"), titleOpts)),
  shown,
]).then(([title]) => title.play()).catch((err) => console.error("title failed", err));

const slots = Object.fromEntries([...world.querySelectorAll("[data-slot]")].map((el) => [el.dataset.slot, el]));
const park = await fetch("tests/park-crowd/park.json").then((r) => r.json());
const clock = createClock();
const sky = getSky({ params });
const canvases = [];
// The park x-range the window shows, [x0, x1] park px with VIEW_MARGIN each side: the whole width on screens 3:2 and
// wider, about a third of it on a portrait phone. Layers whose canvases span the park cover only this range, so their
// memory follows the window: a phone holds far less than a desktop, and Safari closes a tab that outgrows it. They
// read it again in resize(scale).
const VIEW_MARGIN = 32;
const view = () => {
  const [x0, , x1] = F.shown();
  return [Math.max(0, Math.floor(x0 - VIEW_MARGIN)), Math.min(W, Math.ceil(x1 + VIEW_MARGIN))];
};
// The lite park, for phones and tablets (a touch screen, or a device reporting 4 GB or less): Safari closes a tab that
// outgrows the device, and the desktop park's sharpness costs memory a phone hasn't got. In lite, every live canvas
// draws at most at the screen's own resolution counted at 2x (density below), the 3D rides drop antialiasing, the
// rides load one at a time (a lower peak while images decode) and the frame runs at 30 fps. &tier=lite|full forces one.
const LITE = F.lite; // decided in the classic script above
document.documentElement.dataset.tier = LITE ? "lite" : "full";
// Device px per park px for a live canvas: what the layer asks for (its sharpness on a monitor) in full; in lite never
// more than the window shows at 2x, so no layer draws more pixels than a phone screen can show.
const LITE_DPR = Number(params.get("liteDpr")) || 2; // the screen density lite draws for (&liteDpr=3: a 3x phone at full)
const density = (want) => (LITE ? Math.min(want, scale * Math.min(devicePixelRatio || 1, LITE_DPR)) : want);
const ctx = {
  park, W, H, camera: createCamera(park), clock, params, slots, sky,
  scale: () => scale,
  view, lite: LITE, density,
  // Who rides a ride's vehicle key at clock time t (rides/RIDERS.md); null without the crowd: the ride picks its own.
  riders: (name, key, t) => crowd?.riders(name, key, t) ?? null,
  addPatch(url, [x, y, w, h]) {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = url;
    img.alt = "";
    img.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
    slots.plate.append(img);
    return img;
  },
  // A park-sized canvas in a slot; its backing store follows the window (at most maxDensity device px per park px).
  canvas(slot = "rides", { maxDensity = 1.5 } = {}) {
    const c = document.createElement("canvas");
    c.style.cssText = `left:0;top:0;width:${W}px;height:${H}px`;
    slots[slot].append(c);
    const entry = { c, maxDensity, fit() { const d = scale * Math.min(devicePixelRatio || 1, maxDensity / scale); c.width = Math.round(W * d); c.height = Math.round(H * d); c.density = d; } };
    entry.fit();
    canvases.push(entry);
    return c;
  },
};
addEventListener("resize", () => { for (const e of canvases) e.fit(); for (const l of rides) l.resize?.(scale); });

// Breadcrumbs: how far a visit got and how long it ran, kept in localStorage, because a phone shows no console and
// Safari reloads a tab it closed for memory. The panel (&panel) shows the previous visit's last one.
const CRUMB = "park:progress";
let lastVisit = null;
try { lastVisit = JSON.parse(localStorage.getItem(CRUMB) ?? "null"); } catch {}
const crumb = (stage) => { try { localStorage.setItem(CRUMB, JSON.stringify({ stage, s: Math.round(performance.now() / 100) / 10, tier: LITE ? "lite" : "full", at: new Date().toISOString() })); } catch {} };
crumb("start");
setInterval(() => crumb(`running, ${rides.length} rides${crowd ? " + crowd" : ""}`), 5000);
const lastLine = lastVisit ? ` · last visit: ${lastVisit.stage} at ${lastVisit.s} s (${lastVisit.tier}, ${lastVisit.at.slice(5, 16).replace("T", " ")})` : "";

const panel = document.getElementById("panel");
panel.hidden = !params.has("panel");
addEventListener("keydown", (e) => { if (e.key === "h" || e.key === "H") panel.hidden = !panel.hidden; });
let frames = 0, prev = clock.now(), odd = false;
function frame() {
  if (LITE && (odd = !odd)) { requestAnimationFrame(frame); return; } // lite: every other frame, 30 fps
  sky.tick();
  const t = clock.now(), dt = Math.min(0.1, Math.max(0, t - prev));
  prev = t;
  crowd?.update();
  for (const l of rides) l.update?.(t, dt);
  if (!panel.hidden && frames++ % 30 === 0) {
    const st = crowd?.stats() ?? {};
    panel.textContent = `${LITE ? "lite" : "full"} · window ${innerWidth}×${innerHeight} at ${devicePixelRatio}× · painting ${F.loaded} px · ${JSON.stringify(st)}${lastLine}`;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Rides: once the painting is on screen, the ones the window shows, AT_ONCE at a time, in ORDER (what a visitor looks
// at first); the crowd after that first wave (it takes their riders and occluders); rides off screen (phones) load
// when a resize brings them on screen.
const ORDER = ["sky", "sea", "coaster", "wheel", "swings", "carousel", "teacups", "pirate", "thrill", "flume", "traffic"]; // rides not listed load last
const BOXES = { // each ride's box in park px [x0, y0, x1, y1] (from its layer.js); a ride not listed counts as on screen
  sea: [0, 1187, 3840, 2560], traffic: [0, 440, 3840, 1150], coaster: [1990, 900, 3240, 1262], wheel: [2452, 1176, 2708, 1484],
  teacups: [3080, 1428, 3340, 1650], flume: [3010, 890, 3740, 1400], pirate: [690, 1035, 1180, 1305],
  carousel: [1555, 1095, 1790, 1315], thrill: [895, 725, 1415, 1240], swings: [2680, 1335, 2892, 1542],
};
const AT_ONCE = LITE ? 1 : 3;
// &still: the painting, graded by the hour, with nothing moving (a candidate for phones, 2026-11-10).
const STILL = params.has("still");
const wanted = params.has("layers") ? params.get("layers").split(",").filter(Boolean) : ART ? [] : STILL ? ["sky"] : RIDES;
// rides/lights mounts last, after the crowd: it reads the live rides it lights (window.__wheel and the rest).
const queue = [...ORDER.filter((n) => wanted.includes(n)), ...wanted.filter((n) => !ORDER.includes(n) && n !== "lights")];
const riderBlocks = [], occluders = [], state = {};
let running = 0, started = false, waveDone = () => {};
function onScreen(name) {
  const b = BOXES[name];
  if (!b) return true;
  const m = 40, [x0, y0, x1, y1] = F.shown();
  return b[0] < x1 + m && b[2] > x0 - m && b[1] < y1 + m && b[3] > y0 - m;
}
async function mountRide(name) {
  // Plate patches (the painting with the ride erased) stay hidden until the ride is ready, so the painted ride never
  // disappears before the live one shows.
  const patches = [];
  let mounting = true;
  const rideCtx = { ...ctx, name, dir: new URL(`./rides/${name}/`, document.baseURI),
    addPatch(url, rect) { const img = ctx.addPatch(url, rect); if (mounting) { img.style.visibility = "hidden"; patches.push(img); } return img; } };
  try {
    crumb(`loading ${name}`);
    const mod = await import(`./rides/${name}/layer.js`);
    const layer = (await mod.mount(rideCtx)) || {};
    mounting = false;
    await Promise.all(patches.map((img) => img.decode().catch(() => {})));
    for (const img of patches) img.style.visibility = "";
    layer.resize?.(scale);
    rides.push(layer);
    performance.mark(`alive:${name}`);   // milestones for measuring (tests/perf/tools), free in production
    if (layer.riders) riderBlocks.push({ ...layer.riders, name });
    if (layer.occluders) occluders.push({ name, occluders: layer.occluders });
  } catch (err) {
    console.error(`ride layer ${name} failed`, err);
  }
}
function schedule() {
  for (const name of queue) {
    if (running >= AT_ONCE) break;
    if (state[name] || !onScreen(name)) continue;
    state[name] = "loading";
    running++;
    mountRide(name).finally(() => { state[name] = "alive"; running--; schedule(); waveDone(); });
  }
}
addEventListener("resize", () => { if (started) schedule(); });
const firstWave = queue.filter(onScreen);
await shown;
started = true;
// The layers' code is small: ask for every first-wave module now, so the later ones skip a round trip.
for (const n of firstWave) document.head.append(Object.assign(document.createElement("link"), { rel: "modulepreload", href: `rides/${n}/layer.js` }));
await new Promise((done) => { waveDone = () => { if (firstWave.every((n) => state[n] === "alive")) done(); }; schedule(); waveDone(); });

if (params.get("crowd") !== "0" && !STILL && !ART) {
  crumb("loading crowd");
  const { mountCrowd } = await import("./tests/park-crowd/crowd.js");
  crowd = await mountCrowd(document.getElementById("animals"), { params, clock, rides: riderBlocks, occluders, view, density, lite: LITE });
  crowd.resize(scale);
  performance.mark("alive:crowd");
}
if (wanted.includes("lights")) await mountRide("lights");
performance.mark("alive:all");
crumb("all loaded");


await shown;
requestAnimationFrame(() => requestAnimationFrame(() => { document.documentElement.dataset.ready = "1"; }));
</script>
